      padding: 28px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--card);
      text-align: left;
      box-shadow: 0 18px 36px rgba(31, 35, 48, .08);
    }

    h1 {
      margin: 0 0 10px;
      font-size: 1.6rem;
      line-height: 1.25;
    }

    p {
      margin: 0 0 20px;
      color: var(--muted);
    }

    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      border-radius: 6px;
      padding: 9px 15px;
