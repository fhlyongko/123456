<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>수업·연구 통합 포털 | 이용직</title>
<meta name="description" content="학부·대학원 수업 LMS, 비교과 프로그램, 연구 자료를 한곳에서 찾는 통합 포털입니다.">
<style>
  :root{
    --ink:#1c1b29;--text:#2f2e40;--muted:#63627d;--faint:#8b8aa3;
    --line:#e5e4f0;--soft:#f1f0f8;--bg:#fbfafd;--card:#fff;
    --navy:#1E2761;--navy2:#3B4587;--gold:#D9A441;--goldd:#9C7318;
    --u:#2f6f6a;--ub:#e2f0ee;--g:#3a5a86;--gb:#e6edf6;--x:#8a5aa8;--xb:#f0e8f6;--r:#a8602e;--rb:#f7ecdf;
    --maxw:1080px;--navh:58px;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
    --serif:Georgia,"Times New Roman",serif;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:16px;line-height:1.7;-webkit-font-smoothing:antialiased}
  a{color:var(--ink)}
  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 24px}
  nav.top{position:sticky;top:0;z-index:40;background:rgba(251,250,253,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  nav.top .wrap{display:flex;align-items:center;justify-content:space-between;height:var(--navh)}
  nav.top .brand{font-weight:700;font-size:15.5px;color:var(--navy)}
  nav.top .links a{color:var(--muted);text-decoration:none;font-size:13.5px;margin-left:18px}
  nav.top .links a:hover{color:var(--ink)}
  @media(max-width:700px){nav.top .links{display:none}}

  header.hero{background:linear-gradient(135deg,#1E2761,#3B4587 60%,#5b63a8);color:#fff;padding:52px 0 44px;position:relative;overflow:hidden}
  header.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.09)}
  .eyebrow{font-size:12.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:700;margin:0 0 14px}
  header.hero h1{font-family:var(--serif);font-size:36px;line-height:1.2;margin:0 0 12px;font-weight:700}
  header.hero p{font-size:16.5px;color:rgba(255,255,255,.9);margin:0;max-width:640px}
  .stats{display:flex;flex-wrap:wrap;gap:10px 28px;margin-top:22px;font-size:14px;color:rgba(255,255,255,.85)}
  .stats b{color:#fff;font-weight:700}

  .toolbar{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:var(--navh);z-index:30}
  .toolbar .wrap{padding:14px 24px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  #q{flex:1;min-width:200px;height:40px;border:1px solid var(--line);border-radius:9px;padding:0 14px;font-family:inherit;font-size:14px;background:var(--bg)}
  .filters{display:flex;flex-wrap:wrap;gap:7px}
  .f{border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:18px;padding:7px 15px;font-size:13px;cursor:pointer;font-family:inherit}
  .f.on{background:var(--navy);color:#fff;border-color:var(--navy)}

  section{padding:34px 0}
  h2{font-size:20px;margin:0 0 4px;color:var(--ink);font-weight:700}
  .lead{color:var(--muted);font-size:14.5px;margin:0 0 20px}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  @media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:640px){.grid{grid-template-columns:1fr}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:9px;text-decoration:none;color:inherit;transition:.16s;border-top:3px solid var(--line)}
  .card:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(30,39,97,.09);border-color:var(--navy2)}
  .card.u{border-top-color:var(--u)} .card.g{border-top-color:var(--g)}
  .card.x{border-top-color:var(--x)} .card.r{border-top-color:var(--r)}
  .tagrow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .tag{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:5px}
  .tag.u{color:var(--u);background:var(--ub)} .tag.g{color:var(--g);background:var(--gb)}
  .tag.x{color:var(--x);background:var(--xb)} .tag.r{color:var(--r);background:var(--rb)}
  .meta{font-size:11.5px;color:var(--faint);margin-left:auto}
  .card h3{font-size:17px;margin:2px 0 0;color:var(--ink);line-height:1.35;font-weight:700}
  .card p{font-size:13.5px;color:var(--muted);margin:0;line-height:1.55;flex:1}
  .go{font-size:12.5px;font-weight:700;color:var(--navy);margin-top:4px}
  .empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:40px 0;font-size:15px}

  footer{border-top:1px solid var(--line);padding:28px 0 56px;color:var(--faint);font-size:13px;text-align:center;margin-top:20px}
  footer b{color:var(--muted);display:block;font-size:14px;margin-bottom:4px}
  @media print{nav.top,.toolbar{display:none}body{background:#fff}.card{break-inside:avoid}}
</style>
</head>
<body>
<nav class="top"><div class="wrap">
  <span class="brand">수업·연구 통합 포털</span>
  <span class="links"><a href="#" data-nav="u">학부</a><a href="#" data-nav="g">대학원</a><a href="#" data-nav="x">비교과</a><a href="#" data-nav="r">연구·도구</a></span>
</div></nav>

<header class="hero"><div class="wrap">
  <p class="eyebrow">Learning &amp; Research Portal</p>
  <h1>수업 · 연구 통합 포털</h1>
  <p>학부·대학원 수업 LMS, 비교과 프로그램, 연구 자료를 한곳에서 찾을 수 있습니다. 카드를 클릭하면 해당 사이트로 바로 이동합니다.</p>
  <div class="stats">
    <span>수업 LMS <b id="nCourse">–</b></span>
    <span>비교과 <b id="nExtra">–</b></span>
    <span>연구·도구 <b id="nRes">–</b></span>
    <span>운영 <b>국립창원대학교 · 이용직</b></span>
  </div>
</div></header>

<div class="toolbar"><div class="wrap">
  <input id="q" type="search" placeholder="검색: AI, 영어글쓰기, 전공탐색, 유학, 연구윤리 …">
  <div class="filters" id="filters">
    <button class="f on" data-f="all">전체</button>
    <button class="f" data-f="u">학부</button>
    <button class="f" data-f="g">대학원</button>
    <button class="f" data-f="x">비교과</button>
    <button class="f" data-f="r">연구·도구</button>
  </div>
</div></div>

<section><div class="wrap">
  <h2 id="secTitle">전체 사이트</h2>
  <p class="lead" id="secLead">아래 카드를 클릭하면 각 학습 사이트로 바로 연결됩니다.</p>
  <div class="grid" id="grid"></div>
</div></section>

<footer><div class="wrap"><b>수업·연구 통합 포털</b>
<span>국립창원대학교 이용직 · 수업 LMS · 비교과 프로그램 · 연구 아카이브</span></div></footer>

<script>
const B="https://fhlyongko.github.io/123456/";
const SITES=[
 {t:"인공지능입문",d:"AI·머신러닝 기본 개념부터 윤리, 생성형 AI 실습, 프로젝트까지 16주 과정.",u:"global-ai-intro-lms/",c:"u",m:"16주 · 3학점",k:"AI 인공지능 머신러닝 윤리 생성형 프로젝트"},
 {t:"대학생을 위한 영어글쓰기",d:"주제 설정부터 근거 문단, 인용·AI 윤리, 포트폴리오까지 완성하는 학술 글쓰기.",u:"undergraduate-academic-writing-lms/",c:"u",m:"15주 · 5개 페이지",k:"영어 글쓰기 academic writing 인용 포트폴리오 studio"},
 {t:"인공지능과 TED",d:"TED 강연으로 배우는 글로벌 커뮤니케이션. 자료는 PDF로 바로 저장.",u:"ai-ted-lms/student-pdf.html",c:"u",m:"16주 · 원어수업",k:"TED 영어 커뮤니케이션 발표 프로젝트 AI"},
 {t:"에듀테크의 이해",d:"디지털 교육·실감미디어·멀티미디어 학습이론·메타버스·AI 교육을 한 흐름으로.",u:"edutech-understanding-lms/",c:"u",m:"12과 · PDF 9종",k:"에듀테크 메타버스 VR AR 멀티미디어 인지부하 디지털"},
 {t:"전공탐구생활",d:"자기이해→전공탐색→사회변화와 AI→대학생활 설계까지 4단계 로드맵.",u:"major-exploration-lms/",c:"u",m:"16주 · 1학년",k:"전공 탐색 진로 자기이해 포스터 신입생 대학생활"},
 {t:"대학원 영어 논문 작성",d:"연구설계·문헌고찰·방법·결과·논의와 연구윤리까지, 논문 작성 실전 15주.",u:"graduate-academic-writing-lms/",c:"g",m:"15주 · 대학원",k:"논문 영어 research paper 방법론 초록 abstract IRB 대학원"},
 {t:"글로벌 역량 비교과 프로그램",d:"교환학생·유학 준비를 위한 영어역량 강화. 특강 자료 PDF 제공, 마일리지 인정.",u:"global-competency-lms/",c:"x",m:"마일리지 8시간",k:"글로벌 비교과 교환학생 유학 토플 마일리지 영어회화"},
 {t:"AI 연구윤리 실습 도구",d:"단계별 체크리스트, AI 활용 공개서(disclosure) 자동 생성, 저널 정책 비교.",u:"research-ethics-ai/",c:"r",m:"도구 · NEW",k:"연구윤리 AI ethics disclosure 저널 정책 체크리스트 환각"},
 {t:"영어논문 작성 툴킷",d:"연구질문·초록 5문장·리뷰어 체크리스트·AI 공개 문구를 복사해 바로 사용.",u:"writing-toolkit/",c:"r",m:"도구 · NEW",k:"툴킷 템플릿 SOP abstract 초록 리뷰어 체크리스트 복사"},
 {t:"연구 아카이브",d:"논문 19편(SSCI·Scopus·KCI), 연구과제, 학력·경력을 정리한 학술 프로필.",u:"research-archive/",c:"r",m:"논문 19편",k:"연구 아카이브 논문 publication SSCI Scopus 프로필 CV"},
];
const LABEL={u:"학부",g:"대학원",x:"비교과",r:"연구·도구"};
let flt="all";
const $=s=>document.querySelector(s);
function draw(){
 const q=$("#q").value.trim().toLowerCase();
 const list=SITES.filter(s=>flt==="all"||s.c===flt)
   .filter(s=>!q||(s.t+s.d+s.k).toLowerCase().includes(q));
 $("#grid").innerHTML = list.length? list.map(s=>`
   <a class="card ${s.c}" href="${B+s.u}">
     <div class="tagrow"><span class="tag ${s.c}">${LABEL[s.c]}</span><span class="meta">${s.m}</span></div>
     <h3>${s.t}</h3><p>${s.d}</p><div class="go">바로가기 →</div>
   </a>`).join("") : '<div class="empty">검색 결과가 없습니다. 다른 키워드로 찾아보세요.</div>';
 $("#secTitle").textContent = flt==="all"?"전체 사이트":LABEL[flt]+" 사이트";
}
$("#filters").addEventListener("click",e=>{if(!e.target.matches(".f"))return;
 document.querySelectorAll(".f").forEach(b=>b.classList.remove("on"));
 e.target.classList.add("on"); flt=e.target.dataset.f; draw();});
$("#q").addEventListener("input",draw);
document.querySelectorAll('[data-nav]').forEach(a=>a.addEventListener("click",e=>{
 e.preventDefault(); const t=a.dataset.nav;
 document.querySelectorAll(".f").forEach(b=>b.classList.toggle("on",b.dataset.f===t));
 flt=t; draw(); document.querySelector("#secTitle").scrollIntoView({behavior:"smooth",block:"start"});}));
$("#nCourse").textContent=SITES.filter(s=>s.c==="u"||s.c==="g").length;
$("#nExtra").textContent=SITES.filter(s=>s.c==="x").length;
$("#nRes").textContent=SITES.filter(s=>s.c==="r").length;
draw();
</script>
</body>
</html>
